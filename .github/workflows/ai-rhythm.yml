name: Update AI Rhythm

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-rhythm-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify numeric data and rendering
        run: python -m unittest discover -s tests -p 'test_ai_rhythm.py' -q
      - name: Read public AI Field counters and render the card
        run: python scripts/ai_rhythm.py --fetch
      - name: Commit when the card changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/ai-rhythm.svg data/ai-rhythm.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update AI Rhythm'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
