name: Update GitHub stats

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh profile stats
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "STATS_TOKEN is not set, so private contribution stats were left unchanged."
            exit 0
          fi
          node scripts/generate.mjs --fetch
      - name: Commit when the card changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg data/stats.json
          git diff --cached --quiet || (git commit -m "Update GitHub stats" && git push)
