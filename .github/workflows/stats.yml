name: Update GitHub stats

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node.js 24 action runtime
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, Node.js 24 action runtime
        with:
          node-version: 22
      - name: Verify stats fetching
        run: node --test tests/stats.test.mjs
      - name: Refresh profile stats
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "STATS_TOKEN is not set, so private contribution stats were left unchanged."
            exit 0
          fi
          node scripts/generate.mjs --fetch
      - name: Commit when the card changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg data/stats.json
          git diff --cached --quiet || (git commit -m "Update GitHub stats" && git push)
